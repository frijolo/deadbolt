[package]
name = "rust_lib_deadbolt"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "tor_test"
# Diagnostic-only binary. Gated behind a non-default feature so the regular
# Android/cargokit build does not try to link it (the i686-android target
# fails on 64-bit atomic intrinsics in debug mode). Build manually with:
#   cargo build --bin tor_test --features bin_tor_test
required-features = ["bin_tor_test"]

[features]
default = []
bin_tor_test = []

[dependencies]
flutter_rust_bridge = "=2.12.0"
bdk_wallet = { version = "2.3.0", features = ["rusqlite", "keys-bip39", "compiler"] }
bitcoin = { version = "0.32", features = ["secp-recovery"] }
anyhow = {version = "1.0", features = ["backtrace"]}
rand = { version = "0.9", features = ["os_rng"] }
thiserror = "2"
bdk_electrum = "0.23.2"
regex = "1"
hex = "0.4.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
aes-gcm = "0.10"
# Hardware wallet support.
# async-hwi "bitbox" feature is transport-agnostic: works on Android (ChannelTransport)
# and desktop (HID) — no hidapi required at this level.
# USB-specific deps (bitbox-api usb, hidapi) are restricted to non-Android.
async-trait = "0.1"
async-hwi = { version = "0.0.30", default-features = false, features = ["bitbox"] }
bitbox-api = { version = "0.9", features = ["tokio", "multithreaded"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "net", "io-util"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
arti-client = { version = "0.22", default-features = false, features = ["tokio", "rustls", "onion-service-client"] }
tor-rtcompat = { version = "0.22", default-features = false, features = ["tokio", "rustls"] }
# Nostr backup support
nostr = { version = "0.44", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
hmac = "0.12"
sha2 = "0.10"
log = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
# Pre-install the rustls CryptoProvider at app startup to avoid a race condition
# in electrum-client 0.24 where concurrent connections both pass the
# get_default().is_none() check and the second install_default() fails.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
zstd = "0.13"
# BED (Bitcoin Encrypted Descriptor) backup — BIP-138 / `bitcoin-encrypted-backup`
# Pinned to the same commit as `descriptor-cifrado` and Liana 13 for byte-level interop.
bitcoin-encrypted-backup = { git = "https://github.com/pythcoiner/bitcoin-encrypted-backup", rev = "cd7ee382bf5ca0798d4f81697e2f9efb5e32fe40", default-features = false, features = ["miniscript_latest"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# USB HID only available on desktop targets
bitbox-api = { version = "0.9", features = ["usb", "tokio", "multithreaded"] }
hidapi = "2"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
bitbox-api = { git = "https://github.com/frijolo/bitbox-api-rs.git", rev = "d9ba1600cd4f7e9ca017d93d8e807a16647b0e6e" }
async-hwi = { git = "https://github.com/frijolo/async-hwi.git", rev = "e21fdf54d6c9c886ea3df04f2596630407428c82" }

[package.metadata.cargo-machete]
# `bitcoin` is accessed only via `bdk_wallet::bitcoin::*`, but the direct
# dependency is required to activate the `secp-recovery` feature (enables
# RecoverableSignature) on the shared bitcoin crate instance.
ignored = ["bitcoin"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
