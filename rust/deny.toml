[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # adler is unmaintained (RUSTSEC-2025-0056); no safe upgrade available.
    # Transitive dep via flutter_rust_bridge -> backtrace -> miniz_oxide -> adler.
    "RUSTSEC-2025-0056",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",   # unicode-ident
    "MITNFA",             # hex_lit (bitcoin dep)
    "OpenSSL",            # aws-lc-sys (rustls dep)
    "MPL-2.0",            # webpki-roots (electrum-client dep)
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
