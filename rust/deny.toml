[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",        # unicode-ident
    "MITNFA",             # hex_lit (bitcoin dep)
    "OpenSSL",            # aws-lc-sys (rustls dep)
    "MPL-2.0",            # webpki-roots (electrum-client dep)
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
