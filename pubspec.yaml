name: deadbolt
description: "Bitcoin descriptor analyzer"
publish_to: 'none'
version: 1.9.4+26041406

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rust_lib_deadbolt:
    path: rust_builder
  flutter_rust_bridge: 2.11.1
  collection: ^1.19.0
  flutter_bloc: ^9.1.1
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.1
  file_picker: ^10.0.0
  share_plus: ^12.0.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  qr_flutter: ^4.1.0
  bc_ur: ^1.0.0
  mobile_scanner: ^7.0.0
  flutter_lite_camera:
    git:
      url: https://github.com/frijolo/flutter_lite_camera.git
      ref: 3d23a15d05a2a67e1f231023c57fd372255ed64b
  zxing2: ^0.2.4
  image: ^4.0.0
  http: ^1.2.2
  socks5_proxy: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.11.0
  flutter_launcher_icons: ^0.14.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  sqlite3: any

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"
