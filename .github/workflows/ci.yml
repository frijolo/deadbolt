name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --check

      - name: cargo deny
        working-directory: rust
        run: cargo deny check

      - name: cargo audit
        working-directory: rust
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0009 \
            --ignore RUSTSEC-2025-0010 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104

      - name: cargo machete
        working-directory: rust
        run: cargo machete

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --all-features -- -D warnings

      - name: cargo test (with coverage)
        working-directory: rust
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Show Rust coverage summary
        working-directory: rust
        run: cargo llvm-cov report --summary-only

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: rust/lcov.info
          retention-days: 7

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: rust/lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libjpeg-dev lcov libudev-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: flutter pub get
        run: flutter pub get

      - name: cargokit build_tool deps
        working-directory: rust_builder/cargokit/build_tool
        run: dart pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test (with coverage)
        run: flutter test --coverage

      - name: Filter generated files from coverage
        run: |
          lcov --remove coverage/lcov.info \
            'lib/src/rust/*' \
            'lib/l10n/*' \
            -o coverage/lcov.info \
            --ignore-errors unused

      - name: Show Flutter coverage summary
        run: lcov --summary coverage/lcov.info

      - name: Upload Flutter coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 7

      - name: Upload Flutter coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: flutter
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: flutter build linux
        run: flutter build linux --release
